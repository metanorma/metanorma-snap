name: Promotion tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test promotion without Store access
        run: python3 -m unittest discover -s tests -p 'test_promote_snap.py' -v
