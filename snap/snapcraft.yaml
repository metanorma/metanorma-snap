# yaml-language-server: $schema=https://raw.githubusercontent.com/canonical/snapcraft/refs/heads/main/schema/snapcraft.json
---
name: metanorma
base: core24
summary: Metanorma standards publication suite
description: "Metanorma is the award-winning, open-source, digital standards suite for authoring and publishing adopted by SDOs worldwide. Start delivering tomorrow's standards, today.

  This snap bundles the tebako CLI. On the first run of `metanorma` the launcher downloads and checksum-verifies the metanorma payload and its runtimes (Ruby, OpenJDK, Python) into a per-user store under the snap's data directory; every later run starts directly from that store."
grade: stable
adopt-info: tebako-cli
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  metanorma:
    command: bin/metanorma
    plugs:
      - browser-support
      - network
      - gsettings
      - home

parts:
  tebako-cli:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
    override-pull: |
      craftctl default

      # Snap version comes from the VERSION file; the bundled tebako CLI
      # release is pinned in the TEBAKO_VERSION file.
      VERSION=$(cat $SNAPCRAFT_PROJECT_DIR/VERSION)
      TEBAKO_VERSION=$(cat $SNAPCRAFT_PROJECT_DIR/TEBAKO_VERSION)
      echo "Snap version '$VERSION', tebako CLI '$TEBAKO_VERSION'"
      craftctl set version="$VERSION"

      if [ "$CRAFT_ARCH_BUILD_FOR" = "amd64" ]; then
        ARCH_NAME="x86_64"
      elif [ "$CRAFT_ARCH_BUILD_FOR" = "arm64" ]; then
        ARCH_NAME="arm64"
      else
        echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"
        exit 1
      fi

      asset="tebako-${TEBAKO_VERSION}-linux-gnu-${ARCH_NAME}"
      url="https://github.com/tamatebako/tebako/releases/download/v${TEBAKO_VERSION}/${asset}"
      curl --fail --silent --show-error --location --retry 3 -o tebako "$url"
      curl --fail --silent --show-error --location --retry 3 -o "${asset}.sha256" "${url}.sha256"
      expected="$(awk '{print $1}' "${asset}.sha256")"
      echo "${expected}  tebako" | sha256sum -c -
      install -D -m 0755 tebako "$SNAPCRAFT_PART_INSTALL/bin/tebako"

  launcher:
    plugin: nil
    source: .
    override-build: |
      VERSION=$(cat $SNAPCRAFT_PROJECT_DIR/VERSION)
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      sed -e "s/@METANORMA_VERSION@/${VERSION}/" \
          $SNAPCRAFT_PART_SRC/snap/local/bin/metanorma.in \
          > $SNAPCRAFT_PART_INSTALL/bin/metanorma
      chmod 0755 $SNAPCRAFT_PART_INSTALL/bin/metanorma
