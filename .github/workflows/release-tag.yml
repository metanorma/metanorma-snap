name: release-tag

on:
  repository_dispatch:
    # metanorma/packed-metanorma is the release fan-out (payload carries
    # client_payload.version); the older two types stay for the gem chain.
    types: [ metanorma/packed-metanorma, tebako-packages/metanorma, metanorma/packed-mn ]
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version.
        required: true

jobs:
  push-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.event.client_payload.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

    - if: ${{ github.event_name == 'workflow_dispatch' }}
      run: echo SNAP_VERSION=${{ github.event.inputs.next_version }} >> ${GITHUB_ENV}

    - if: ${{ github.event_name == 'repository_dispatch' }}
      # Prefer the explicit product version (the packed-metanorma fan-out
      # sends it; its tags carry a feedstock suffix like v1.17.0-1, which
      # must NOT leak into the snap version). Fall back to the ref for the
      # gem-chain event types.
      run: |
        V="${{ github.event.client_payload.version }}"
        if [ -z "$V" ]; then V="${{ github.event.client_payload.ref }}"; V="${V#refs/tags/v}"; fi
        echo SNAP_VERSION=$V >> ${GITHUB_ENV}

    - name: Skip when already at the target version
      id: guard
      run: |
        if [ "$(cat VERSION)" = "${SNAP_VERSION}" ]; then
          echo "VERSION already at ${SNAP_VERSION} — nothing to bump"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo -n ${SNAP_VERSION} > VERSION

    - if: steps.guard.outputs.skip != 'true'
      name: Push commit and tag
      run: |
        git config --global user.name "metanorma-ci"
        git config --global user.email "metanorma-ci@users.noreply.github.com"
        git add VERSION
        git commit -m "Bump version to ${SNAP_VERSION}"
        git tag v${SNAP_VERSION}
        git push origin HEAD:${GITHUB_REF} --tags
