name: promote-to-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact candidate version to promote (for example, 1.17.0)'
        required: true
        type: string
      revisions:
        description: 'Optional complete comma-separated candidate revision set'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Exact version published by this release'
        required: true
        type: string
      architectures:
        description: 'JSON architecture array from the publishing matrix'
        required: true
        type: string
      revisions:
        description: 'Optional complete comma-separated candidate revision set'
        required: false
        type: string
    secrets:
      METANORMA_SNAPCRAFT_TOKEN:
        required: true

concurrency:
  group: metanorma-stable-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote complete release to stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Resolve expected architectures
        id: architectures
        env:
          INPUT_ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          if [ -n "$INPUT_ARCHITECTURES" ]; then
            architectures="$INPUT_ARCHITECTURES"
          else
            architectures=$(yq eval '.platforms | keys' snap/snapcraft.yaml -o json)
          fi
          architectures=$(jq -er '
            if type == "array" and length > 0 and
               all(.[]; type == "string" and test("^[a-z][a-z0-9]*$"))
            then join(",")
            else error("Expected a nonempty architecture array")
            end' <<< "$architectures")
          echo "value=$architectures" >> "$GITHUB_OUTPUT"

      - name: Validate, promote and verify all architectures
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.METANORMA_SNAPCRAFT_TOKEN }}
          TARGET_VERSION: ${{ inputs.version }}
          EXPECTED_ARCHITECTURES: ${{ steps.architectures.outputs.value }}
          CANDIDATE_REVISIONS: ${{ inputs.revisions }}
        run: |
          args=(--version "$TARGET_VERSION" --architectures "$EXPECTED_ARCHITECTURES")
          if [ -n "$CANDIDATE_REVISIONS" ]; then
            args+=(--revisions "$CANDIDATE_REVISIONS")
          fi
          bash .github/scripts/promote-snap.sh "${args[@]}"
