name: main

on:
  push:
    branches: [ main ]
    tags: [ v* ]
    paths-ignore:
      - 'README.adoc'
      - '.github/workflows/release-tag.yml'
      - '.github/workflows/promote-to-stable.yml'
      - '.github/workflows/re-tag.yml'
  pull_request:
    paths-ignore:
      - 'README.adoc'
      - '.github/workflows/release-tag.yml'
      - '.github/workflows/promote-to-stable.yml'
      - '.github/workflows/re-tag.yml'

jobs:
  get-architectures:
    name: Get snap architectures
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.get-architectures.outputs.architectures }}
    steps:
      - uses: actions/checkout@v4
      - name: Get snap architectures
        id: get-architectures
        run: |
          # Extract architectures from snapcraft.yaml (handle both old architectures and new platforms format)
          if yq eval '.platforms' snap/snapcraft.yaml >/dev/null 2>&1 && [ "$(yq eval '.platforms' snap/snapcraft.yaml)" != "null" ]; then
            # New format: platforms
            architectures=$(yq eval '.platforms | keys' snap/snapcraft.yaml -o json | jq -c '.')
          else
            # Old format: architectures
            architectures=$(yq eval '.architectures[].build-on' snap/snapcraft.yaml | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "architectures=$architectures" >> $GITHUB_OUTPUT
          echo "Found architectures: $architectures"

  build:
    name: Build snap (${{ matrix.architecture }})
    needs: [get-architectures]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.get-architectures.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v4
      - name: Show pinned versions
        run: |
          echo "metanorma payload: $(cat VERSION)"
          echo "tebako CLI:        $(cat TEBAKO_VERSION)"
      - name: Build snap for ${{ matrix.architecture }}
        id: snapcraft
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: metanorma-snap-${{ matrix.architecture }}
          path: ${{ steps.snapcraft.outputs.snap }}
          retention-days: 5

  acceptance:
    name: Acceptance — compile inside strict confinement (${{ matrix.architecture }})
    needs: [build, get-architectures]
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            experimental: false
          - architecture: arm64
            # Experimental: metanorma's inkscape dependency is not
            # published for aarch64-linux-gnu (tebako-packages/inkscape
            # 1.4.3-4 ships only x86_64-linux-gnu / macos-arm64 /
            # windows-ucrt64), so the first-run install fails closed
            # with exit 69 until the payload gains that triplet.
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: metanorma-snap-${{ matrix.architecture }}
          path: ./snap

      - name: Install snap (strict confinement, unsigned)
        run: |
          sudo snap install --dangerous snap/*.snap
          sudo snap connect metanorma:home :home
          snap connections metanorma

      - name: metanorma version (first run installs payload + runtimes)
        timeout-minutes: 30
        run: metanorma version 2>&1 | tee version.log

      - name: Compile a real ISO document (xml/html/doc/pdf)
        timeout-minutes: 30
        run: |
          mkdir -p "$HOME/mn-acceptance"
          cp "$GITHUB_WORKSPACE/tests/iso.adoc" "$HOME/mn-acceptance/"
          cd "$HOME/mn-acceptance"
          metanorma compile -t iso -x xml,html,doc,pdf --agree-to-terms iso.adoc 2>&1 | tee "$GITHUB_WORKSPACE/compile.log"
          ls -la
          test -s iso.xml && test -s iso.html && test -s iso.doc && test -s iso.pdf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-log-${{ matrix.architecture }}
          path: |
            version.log
            compile.log
          retention-days: 14

  credentials-check:
    name: Check store credentials
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not configured; snap store upload jobs will be skipped."
          fi

  publish:
    name: Publish snap (${{ matrix.architecture }})
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.credentials-check.outputs.present == 'true'
    needs: [build, acceptance, get-architectures, credentials-check]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.get-architectures.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: metanorma-snap-${{ matrix.architecture }}
          path: ./snap

      - name: Get snap file path
        id: get-snap-file
        run: |
          snap_file=$(find snap/ -name "*.snap" -type f | head -n 1)
          if [ -z "$snap_file" ]; then
            echo "Error: No snap file found in snap/ directory"
            exit 1
          fi
          echo "snap_file=$snap_file" >> $GITHUB_OUTPUT

      - name: Get snap version
        id: get-snap-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check if version exists in edge/beta channels (main branch)
        id: check-main-channels
        if: github.ref == 'refs/heads/main'
        run: |
          # Use shared script to check if version exists in target channels
          # Exit code 0 = should publish, Exit code 1 = should skip
          if .github/scripts/check-snap-version.sh \
            --channels "edge,beta" \
            --version "${{ steps.get-snap-version.outputs.version }}" \
            --architecture "${{ matrix.architecture }}"; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version exists in beta/candidate channels (tags)
        id: check-tag-channels
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Use shared script to check if version exists in target channels
          # Exit code 0 = should publish, Exit code 1 = should skip
          if .github/scripts/check-snap-version.sh \
            --channels "beta,candidate" \
            --version "${{ steps.get-snap-version.outputs.version }}" \
            --architecture "${{ matrix.architecture }}"; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      # Publish to edge and beta for main branch
      - name: Publish ${{ matrix.architecture }} to edge and beta
        if: github.ref == 'refs/heads/main' && steps.check-main-channels.outputs.should_publish == 'true'
        uses: snapcore/action-publish@v1
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.get-snap-file.outputs.snap_file }}
          release: edge,beta

      - name: Skip publishing to edge and beta (already exists)
        if: github.ref == 'refs/heads/main' && steps.check-main-channels.outputs.should_publish == 'false'
        run: |
          echo "Skipping publish to edge/beta - version ${{ steps.get-snap-version.outputs.version }} already exists for ${{ matrix.architecture }}"

      # Publish to beta and candidate for tags
      - name: Publish ${{ matrix.architecture }} to beta and candidate
        if: startsWith(github.ref, 'refs/tags/v') && steps.check-tag-channels.outputs.should_publish == 'true'
        uses: snapcore/action-publish@v1
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.get-snap-file.outputs.snap_file }}
          release: beta,candidate

      - name: Skip publishing to beta and candidate (already exists)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check-tag-channels.outputs.should_publish == 'false'
        run: |
          echo "Skipping publish to beta/candidate - version ${{ steps.get-snap-version.outputs.version }} already exists for ${{ matrix.architecture }}"

  promote-to-stable:
    if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref, 'pre') && needs.credentials-check.outputs.present == 'true'
    name: Promote to stable
    needs: [publish, credentials-check]
    uses: ./.github/workflows/promote-to-stable.yml
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
